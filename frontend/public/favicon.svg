<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Squircle with Gradient Border -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="#06080F" stroke="url(#brandGrad)" stroke-width="5" />

  <!-- Glowing Cyan Robot Head -->
  <g filter="url(#glow)">
    <!-- Antenna -->
    <path d="M 46 25 L 54 25 L 54 32 L 46 32 Z" fill="#22d3ee" />
    <circle cx="50" cy="22" r="3" fill="#22d3ee" />

    <!-- Head Body -->
    <rect x="25" y="34" width="50" height="38" rx="10" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Ears / Pins -->
    <line x1="17" y1="53" x2="24" y2="53" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" />
    <line x1="76" y1="53" x2="83" y2="53" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" />

    <!-- Glowing Eyes -->
    <rect x="37" y="46" width="6" height="13" rx="3" fill="#22d3ee" />
    <rect x="57" y="46" width="6" height="13" rx="3" fill="#22d3ee" />
  </g>
</svg>
